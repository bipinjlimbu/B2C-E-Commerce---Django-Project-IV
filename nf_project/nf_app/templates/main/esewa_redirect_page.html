<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway | NepFit</title>
    {% load static %}
    <link href="{% static 'css/styles.css' %}" rel="stylesheet" />
</head>
<body class="bg-[#FAFAF9] text-[#4B5563] font-sans flex items-center justify-center min-h-screen p-4 antialiased selection:bg-[#C1121F] selection:text-white">

    <div class="w-full max-w-md">
        <div class="bg-[#FFFFFF] border border-[#E5E7EB] rounded-3xl p-8 sm:p-10 shadow-xl relative overflow-hidden text-center">
            
            <div class="h-1.5 bg-gradient-to-r from-[#C1121F] via-[#D4A017] to-[#1F2937] absolute top-0 left-0 right-0"></div>

            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#1F2937] text-[#D4A017] text-[11px] font-bold uppercase tracking-widest mb-8 border border-[#D4A017]/20 shadow-xs">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#D4A017]"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                NepFit Secure Checkout
            </div>

            <div class="relative w-28 h-28 mx-auto mb-8 flex items-center justify-center">
                <div class="absolute inset-0 border-4 border-[#E5E7EB] rounded-full"></div>
                <div class="absolute inset-0 border-4 border-[#C1121F] border-t-transparent rounded-full animate-spin"></div>
                <div class="absolute inset-3 border-2 border-dashed border-[#D4A017]/50 rounded-full animate-spin [animation-duration:3s]"></div>
                
                <div class="w-16 h-16 bg-[#FAFAF9] rounded-full flex items-center justify-center border border-[#E5E7EB] shadow-inner relative z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-[#C1121F] animate-pulse"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>
                </div>
            </div>

            <h1 class="text-2xl font-extrabold text-[#111827] tracking-tight mb-2">
                Securing Your <span class="text-[#C1121F]">Payment</span>
            </h1>

            <p class="text-xs text-[#4B5563] font-medium leading-relaxed max-w-xs mx-auto mb-8">
                Connecting to eSewa to safely process your order. Please do not refresh or close this page.
            </p>

            <div class="bg-[#FAFAF9] border border-[#E5E7EB] rounded-2xl p-4 flex items-center justify-between gap-3 text-left mb-8 shadow-2xs">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-[#16A34A]/10 border border-[#16A34A]/20 flex items-center justify-center shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#16A34A]"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
                    </div>
                    <div>
                        <p class="text-[11px] font-bold uppercase tracking-wider text-[#111827]">256-Bit SSL Encryption</p>
                        <p class="text-[10px] text-[#4B5563] font-medium">Your financial data is fully protected</p>
                    </div>
                </div>
                <div class="w-2 h-2 rounded-full bg-[#16A34A] animate-ping shrink-0"></div>
            </div>

            <div class="pt-2 border-t border-[#E5E7EB] flex items-center justify-center gap-2 text-[11px] text-[#4B5563] font-semibold">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[#D4A017]"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <span>Automated redirecting in a moment...</span>
            </div>

        </div>

        <form id="esewa_form" action="{{ esewa_url }}" method="POST" class="hidden">
            <input type="hidden" name="amount" value="{{ amount }}">
            <input type="hidden" name="tax_amount" value="0">
            <input type="hidden" name="total_amount" value="{{ amount }}">
            <input type="hidden" name="transaction_uuid" value="{{ transaction_uuid }}">
            <input type="hidden" name="product_code" value="{{ product_code }}">
            <input type="hidden" name="product_service_charge" value="0">
            <input type="hidden" name="product_delivery_charge" value="0">
            <input type="hidden" name="success_url" value="{{ success_url }}">
            <input type="hidden" name="failure_url" value="{{ failure_url }}">
            <input type="hidden" name="signed_field_names" value="total_amount,transaction_uuid,product_code">
            <input type="hidden" name="signature" value="{{ signature }}">
        </form>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                document.getElementById('esewa_form').submit();
            }, 800); 
        };
    </script>
</body>
</html>
